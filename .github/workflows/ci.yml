name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            generator: "Visual Studio 18 2026"
            config: Release
          - os: macos-latest
            generator: "Xcode"
            config: Release
          - os: ubuntu-latest
            generator: "Unix Makefiles"
            config: Release

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libasound2-dev \
            libfreetype6-dev \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libcurl4-openssl-dev \
            pkg-config

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -G "${{ matrix.generator }}" -A x64 -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Pack Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\pack-windows.ps1 -Config Release -OutDir dist

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SkeletonHive-windows-x64
          path: |
            dist/*.zip
            build/SkeletonHive_artefacts/Release/SkeletonHive.exe

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: SkeletonHive-${{ matrix.os }}
          path: build/SkeletonHive_artefacts/Release/SkeletonHive.app

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: SkeletonHive-${{ matrix.os }}
          path: build/SkeletonHive_artefacts/Release/SkeletonHive
