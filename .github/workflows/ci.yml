name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            generator: "Visual Studio 18 2026"
            config: Release
          - os: macos-latest
            generator: "Ninja"
            config: Release
          - os: ubuntu-latest
            generator: "Ninja"
            config: Release

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Match juce-framework/JUCE docs/Linux Dependencies.md (Ubuntu 22/24).
          # LADSPA hosting is enabled on Linux; JACK is optional at runtime but
          # required at configure unless JUCE_JACK=0.
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            libegl-dev

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -G "${{ matrix.generator }}" -A x64 -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config ${{ matrix.config }} --parallel 2>&1 | tee build-log.txt

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: build-log.txt
          if-no-files-found: ignore

      - name: Pack Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\pack-windows.ps1 -Config Release -OutDir dist

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SkeletonHive-windows-x64
          path: |
            dist/*.zip
            build/SkeletonHive_artefacts/Release/SkeletonHive.exe

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: SkeletonHive-${{ matrix.os }}
          path: |
            build/SkeletonHive_artefacts/Release/SkeletonHive.app
            build/SkeletonHive_artefacts/SkeletonHive.app
          if-no-files-found: error

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: SkeletonHive-${{ matrix.os }}
          path: |
            build/SkeletonHive_artefacts/Release/SkeletonHive
            build/SkeletonHive_artefacts/SkeletonHive
          if-no-files-found: error
