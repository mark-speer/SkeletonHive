name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -G "Visual Studio 18 2026" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Pack Windows portable zip
        shell: pwsh
        run: .\scripts\pack-windows.ps1 -Config Release -OutDir dist

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            Portable Windows build of SkeletonHive.

            Source: https://github.com/mark-speer/SkeletonHive

            Unpack the zip and run `SkeletonHive.exe`. See `README.txt` inside the archive for audio/plugin notes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
